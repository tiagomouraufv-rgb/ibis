pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Repositório da Onyx (Boox), endereço publicado pela própria Onyx. Ele usa http (sem cadeado),
        // por isso fica restrito: o Gradle só busca nele as bibliotecas listadas abaixo, nada mais.
        maven {
            url 'http://repo.boox.com/repository/maven-public/'
            allowInsecureProtocol = true
            // além das bibliotecas da Onyx, as que o kit da caneta (1.5.x) usa e só existem nesse repositório
            content {
                includeGroupByRegex 'com\\.onyx.*'
                includeGroup 'pub.devrel'
                includeGroup 'com.tencent'
                includeGroupByRegex 'com\\.jakewharton\\.hugo.*'
            }
        }
    }
}
rootProject.name = "LeitorPesquisa"
include ':app'
