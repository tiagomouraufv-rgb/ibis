pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Repositório da Onyx (Boox), endereço publicado pela própria Onyx. Ele usa http (sem cadeado),
        // por isso fica restrito: o Gradle só busca nele as bibliotecas com.onyx, nada mais.
        maven {
            url 'http://repo.boox.com/repository/maven-public/'
            allowInsecureProtocol = true
            content { includeGroupByRegex 'com\\.onyx.*' }
        }
    }
}
rootProject.name = "LeitorPesquisa"
include ':app'
